name: CI – Tests und Linting

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Python ${{ matrix.python-version }} einrichten
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Python-Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install \
            google-api-python-client==2.108.0 \
            google-auth-httplib2==0.2.0 \
            google-auth-oauthlib==1.1.0 \
            holidays==0.42 \
            python-dotenv==1.0.0 \
            PyYAML==6.0.1 \
            pytest==7.4.3 \
            pytest-mock==3.12.0 \
            flake8

      - name: Linting mit flake8
        run: |
          # PyQt5-Importe werden beim Linting ignoriert (--per-file-ignores)
          flake8 src/ tests/ \
            --max-line-length=100 \
            --exclude=__pycache__ \
            --per-file-ignores="src/ui/*.py:F401,F821 tests/test_week_view.py:F401,F821 tests/test_image_widget.py:F401,F821"

      - name: Unit-Tests ausführen (ohne PyQt5-UI-Tests)
        run: |
          # UI-Tests benötigen PyQt5 und einen Display – werden auf dem Pi getestet
          pytest tests/ -v \
            --ignore=tests/test_week_view.py \
            --ignore=tests/test_image_widget.py
