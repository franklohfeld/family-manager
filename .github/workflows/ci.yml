name: CI – Tests und Linting

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Python ${{ matrix.python-version }} einrichten
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Qt-Abhängigkeiten installieren (für PyQt5)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-xinerama0 libxcb-cursor0 \
            libxkbcommon-x11-0 libgl1-mesa-dev xvfb

      - name: Python-Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Linting mit flake8
        run: |
          pip install flake8
          flake8 src/ tests/ --max-line-length=100 --exclude=__pycache__

      - name: Tests ausführen
        env:
          DISPLAY: ":99"
        run: |
          Xvfb :99 -screen 0 1024x768x24 &
          sleep 1
          pytest tests/ -v --ignore=tests/test_week_view.py
